# 桌游厅：games.anois.site → tabletop 容器（网页 + WebSocket 同一端口）。
#
# 这份文件由 deploy/ship.sh 放到服务器的 /srv/wenpai/nginx/，被塔罗项目的 Nginx 容器加载。
# 塔罗那边的 ship.sh 同步 nginx/ 时不带 --delete，所以它不会被删掉；
# 但它引用的证书不存在时 nginx -t 会失败，连带塔罗也发不了版 —— ship.sh 只在证书就位后才放它进去。
#
# 证书（腾讯云 DV，SAN 必须含 games.anois.site）：
#   /srv/wenpai/certs/games.anois.site.fullchain.pem
#   /srv/wenpai/certs/games.anois.site.privkey.pem

map $http_upgrade $tabletop_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name games.anois.site;
    location / {
        return 301 https://games.anois.site$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name games.anois.site;

    ssl_certificate     /etc/nginx/certs/games.anois.site.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/games.anois.site.privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # 请求时再解析上游：桌游容器不在时只有这个站 502，不会让 Nginx 整个起不来、拖垮塔罗
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    location / {
        set $tabletop http://tabletop:8080;
        proxy_pass $tabletop;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $tabletop_connection;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 服务端每 15 秒 ping 一次，空闲连接不会撞上这个超时
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 64k;
    }
}
